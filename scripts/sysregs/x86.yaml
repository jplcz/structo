#
# Hand-maintained raw register definitions for 32-bit x86. Consumed by
# gen_sysreg_headers.py to generate include/structo/arch/x86/sysregs_generated.hpp
# (merged with x86_64.yaml into a single mode-guarded header).
#
# fields: list of "name:bit:len" strings (bit = LSB offset, len = width in bits).
arch: x86
registers:
- name: cr0
  width: 32
  access:
  - read
  - write
  encoding:
    kind: mov_cr
    reg: cr0
  fields: []
- name: cr2
  width: 32
  access:
  - read
  - write
  encoding:
    kind: mov_cr
    reg: cr2
  fields: []
- name: cr3
  width: 32
  access:
  - read
  - write
  encoding:
    kind: mov_cr
    reg: cr3
  fields: []
- name: cr4
  width: 32
  access:
  - read
  - write
  encoding:
    kind: mov_cr
    reg: cr4
  fields: []
- name: eflags
  width: 32
  access:
  - read
  - write
  encoding:
    kind: pushf_popf
  fields: []
- name: ia32_efer
  width: 64
  access:
  - read
  - write
  encoding:
    kind: rdmsr_wrmsr
    msr: 0xc0000080
  fields: []
