#
# Hand-maintained raw system-register definitions for AArch32 (armv7-a and
# later; older ARM architecture versions are out of scope). Consumed by
# gen_sysreg_headers.py to generate include/structo/arch/arm/sysregs_generated.hpp.
#
# encoding.kind:
#   coproc   - single-register MRC/MCR coprocessor access (32-bit).
#   coproc64 - register-pair MRRC/MCRR coprocessor access (64-bit), used for
#              LPAE long-descriptor registers (lpae_ttbr0/1, lpae_par),
#              virtualization registers (vttbr, httbr) and the 64-bit
#              generic timer registers (cntpct, cntvct, ...). Fields:
#              coproc, opc1, crm (no crn/opc2 in this transfer form).
#   status   - plain MRS/MSR status register access (cpsr, spsr).
#
# fields: list of "name:bit:len" strings (bit = LSB offset, len = width in bits).
#
# Short-descriptor vs. LPAE: ttbr0/ttbr1/par exist in two incompatible forms on
# armv7-a: the classic 32-bit short-descriptor form (short_ttbr0/1, short_par)
# and the 64-bit LPAE long-descriptor form (lpae_ttbr0/1, lpae_par), the latter
# only valid once the MMU's TTBCR.EAE bit selects LPAE translation.
