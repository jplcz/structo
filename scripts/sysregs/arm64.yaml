# encoding: op0/op1/crn/crm/op2 identify the register for `mrs`/`msr Sop0_op1_Cn_Cm_op2`.
# EL3 registers (*_el3) were derived by matching each EL1 register's CRn/CRm/op2
# tuple with op1=6 (op1 is 0/4/5/6 for EL1/EL2/EL12/EL3 respectively), cross-checked
# against arm-trusted-firmware's symbolic mrs/msr usage and S3_6_C*_C*_* encodings.
#
# fields: list of "name:bit:len" strings (bit = LSB offset, len = width in bits).
