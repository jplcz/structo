name: Version bump

# Manual-only: never triggers on push/PR/schedule, since bumping the
# version is a deliberate release-management action, not something that
# should ever happen implicitly from routine CI.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Open version bump pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Bump version in CMakeLists.txt/conanfile.py/vcpkg.json
        id: bump
        run: python3 scripts/bump-version.py --bump "${{ inputs.bump }}"

      # Branch-protected default branches reject a direct push, so the
      # bump is proposed as a pull request instead of being committed
      # straight to ${{ github.ref_name }}. Run the Release workflow
      # (workflow_dispatch) after merging to tag the merge commit and
      # publish a GitHub release.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          title: "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          body: |
            Automated version bump: v${{ steps.bump.outputs.old_version }} -> v${{ steps.bump.outputs.new_version }}.

            After merging, run the **Release** workflow (`workflow_dispatch`) to tag this commit and publish a GitHub release.
          branch: version-bump/v${{ steps.bump.outputs.new_version }}
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: version-bump
